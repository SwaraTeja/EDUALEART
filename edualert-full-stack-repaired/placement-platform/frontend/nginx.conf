server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: deep links like /course/123 or /reset?token=… must serve index.html
  location / {
    try_files $uri /index.html;
  }

  # Optional: same-origin API proxy so the browser needs no CORS at all (used when VITE_API_URL is empty).
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;            # keeps AI streaming (SSE) responses flowing
    proxy_read_timeout 120s;
  }
}
